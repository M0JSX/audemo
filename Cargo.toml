[package]
name = "audemo"
version = "1.7.0"
edition = "2021"
rust-version = "1.80"
description = "Audemo: a cross-platform waveform audio editor with a built-in effects suite"
license = "MIT"
authors = ["Jonathan <jonathan@m0jsx.radio>"]

[[bin]]
name = "audemo"
path = "src/main.rs"

[dependencies]
# GUI. Versions are pinned to known APIs; bump deliberately.
eframe = "0.29.1"
# Audio devices: WASAPI and ASIO on Windows, Core Audio on macOS, ALSA and
# JACK on Linux (the per-platform features are added below).
cpal = "0.15.3"
# Decoding: WAV, AIFF, FLAC, MP3, OGG/Vorbis, AAC/M4A, ALAC, MKV/WebM.
symphonia = { version = "0.5.4", features = ["all"] }
# MP3 export (LAME, built from source).
mp3lame-encoder = "0.2.5"
# AAC export (Fraunhofer FDK AAC, built from source).
fdk-aac = "0.8.0"
# Native open/save dialogs.
rfd = "0.14.1"
# MIDI for control surfaces (Mackie Control).
midir = "0.10.0"
# HTTPS for Check for Updates (rustls: no system TLS libraries needed).
ureq = "2.10"

# ASIO: builds the Steinberg ASIO SDK (CPAL_ASIO_DIR, or downloaded) and
# needs LLVM/clang for its bindings.
[target.'cfg(windows)'.dependencies]
cpal = { version = "0.15.3", features = ["asio"] }

# JACK: needs libjack headers to build; libjack is loaded at run time only
# when JACK is chosen, so it isn't a package dependency.
[target.'cfg(target_os = "linux")'.dependencies]
cpal = { version = "0.15.3", features = ["jack"] }

[target.'cfg(unix)'.dependencies]
libc = "0.2"

# Native menu bar at the top of the screen on macOS.
[target.'cfg(target_os = "macos")'.dependencies]
muda = "0.15"
arboard = "3.4"

[lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(audemo_check_menu)', 'cfg(audemo_std_test)', 'cfg(audemo_stub)'] }

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
strip = true

# DSP is slow without optimisation, so speed up debug builds too.
[profile.dev]
opt-level = 1

[profile.dev.package."*"]
opt-level = 2
