[package]
name = "audemo"
version = "0.7.0"
edition = "2021"
rust-version = "1.80"
description = "Audemo: a cross-platform waveform audio editor with a built-in effects suite"
license = "MIT"
authors = ["Jonathan <jonathan@m0jsx.radio>"]

[[bin]]
name = "audemo"
path = "src/main.rs"

[dependencies]
# GUI. Versions are pinned to known APIs; bump deliberately.
eframe = "0.29.1"
# Audio devices (WASAPI on Windows, CoreAudio on macOS, ALSA on Linux).
cpal = "0.15.3"
# Decoding: WAV, AIFF, FLAC, MP3, OGG/Vorbis, AAC/M4A, ALAC, MKV/WebM.
symphonia = { version = "0.5.4", features = ["all"] }
# WAV export.
hound = "3.5.1"
# Native open/save dialogs.
rfd = "0.14.1"

[target.'cfg(unix)'.dependencies]
libc = "0.2"

# Native menu bar at the top of the screen on macOS.
[target.'cfg(target_os = "macos")'.dependencies]
muda = "0.15"
arboard = "3.4"

[lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(audemo_check_menu)'] }

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
strip = true

# DSP is slow without optimisation, so speed up debug builds too.
[profile.dev]
opt-level = 1

[profile.dev.package."*"]
opt-level = 2
