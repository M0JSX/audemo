name: Build

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Windows x64
            os: windows-latest
            artifact: audemo-windows
          - name: macOS universal
            os: macos-latest
            artifact: audemo-macos
          - name: Linux x64
            os: ubuntu-22.04
            artifact: audemo-linux

    steps:
      - uses: actions/checkout@v7

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ runner.os == 'macOS' && 'aarch64-apple-darwin,x86_64-apple-darwin' || '' }}

      - uses: Swatinem/rust-cache@v2

      - name: Install Linux build dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y pkg-config libasound2-dev libxkbcommon-dev libwayland-dev \
            libxcb-render0-dev libxcb-shape0-dev libxcb-xfixes0-dev libgtk-3-dev libfuse2 \
            libjack-jackd2-dev

      # ASIO support builds Steinberg's ASIO SDK; bindgen needs libclang.
      - name: ASIO SDK and LLVM (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          curl.exe -fsSL -o asio.zip https://www.steinberg.net/asiosdk
          7z x -oasio_tmp asio.zip | Out-Null
          $inner = Get-ChildItem asio_tmp -Directory | Select-Object -First 1
          $dir = Join-Path $env:RUNNER_TEMP "asio_sdk"
          Move-Item $inner.FullName $dir
          Get-ChildItem $dir
          "CPAL_ASIO_DIR=$dir" | Out-File -FilePath $env:GITHUB_ENV -Append
          if (-not (Test-Path "C:\Program Files\LLVM\bin\libclang.dll")) { choco install llvm -y --no-progress }
          "LIBCLANG_PATH=C:\Program Files\LLVM\bin" | Out-File -FilePath $env:GITHUB_ENV -Append

      - name: Test
        shell: bash
        run: |
          set +e
          cargo test --release 2>&1 | tee test.log
          status=${PIPESTATUS[0]}
          if [ "$status" != "0" ]; then
            # Surface the failure as an annotation (readable from the API).
            msg=$(grep -E "^error|^warning: unused|panicked|assert|left:|right:|FAILED|failures:|^  --> |^   --> |error:" test.log | head -60 | sed 's/%/%25/g' | awk '{printf "%s%%0A", $0}')
            echo "::error title=cargo test failed::$msg"
          fi
          exit $status

      # ---------------------------------------------------------------- Windows
      - name: Build, zip and MSI (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          cargo build --release
          $version = (Select-String -Path Cargo.toml -Pattern '^version = "(.+)"' | Select-Object -First 1).Matches.Groups[1].Value
          New-Item -ItemType Directory -Force dist/portable | Out-Null
          Copy-Item target/release/audemo.exe dist/portable/Audemo.exe
          Copy-Item README.md dist/portable/
          Compress-Archive -Force -Path dist/portable/* -DestinationPath dist/audemo-windows-x64-portable.zip
          dotnet tool install --global wix --version 5.0.2
          wix build assets/windows/audemo.wxs -arch x64 `
            -d "ExePath=target/release/audemo.exe" `
            -d "IconPath=assets/icons/audemo.ico" `
            -d "Version=$version" `
            -o "dist/Audemo-$version-x64.msi"
          Get-ChildItem dist

      # ---------------------------------------------------------------- macOS
      - name: Build app, zip and DMG (macOS)
        if: runner.os == 'macOS'
        run: bash scripts/package-macos.sh

      # ---------------------------------------------------------------- Linux
      - name: Build tarball, .deb and AppImage (Linux)
        if: runner.os == 'Linux'
        run: |
          cargo build --release
          bash scripts/package-linux.sh

      - uses: actions/upload-artifact@v7
        with:
          name: ${{ matrix.artifact }}
          path: |
            dist/*.msi
            dist/*.zip
            dist/*.dmg
            dist/*.deb
            dist/*.AppImage
            dist/*.tar.gz
          if-no-files-found: error

  android:
    name: Android
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android,x86_64-linux-android

      - uses: Swatinem/rust-cache@v2
        with:
          key: android

      # The runner has the Android SDK and NDK. Signing uses the repository's
      # keystore secret when set, so each build installs over the last.
      - name: Build APK
        env:
          ANDROID_KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_B64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
        run: |
          export ANDROID_NDK_HOME="$ANDROID_NDK_LATEST_HOME"
          if [ -n "$ANDROID_KEYSTORE_B64" ]; then
            echo "$ANDROID_KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/audemo.keystore"
            export AUDEMO_ANDROID_KEYSTORE="$RUNNER_TEMP/audemo.keystore"
            export AUDEMO_ANDROID_KEYSTORE_PASS="$ANDROID_KEYSTORE_PASSWORD"
          fi
          set +e
          bash scripts/package-android.sh 2>&1 | tee android.log
          status=${PIPESTATUS[0]}
          if [ "$status" != "0" ]; then
            sed 's/\x1b\[[0-9;]*m//g' android.log > plain.log
            msg=$(grep -E -A6 "^error|fatal error|^  --> |^   --> |panicked|undefined symbol|cannot find" plain.log | head -80 | cut -c1-240 | sed 's/%/%25/g' | awk '{printf "%s%%0A", $0}')
            echo "::error title=Android build errors::$msg"
            msg=$(tail -40 plain.log | cut -c1-240 | sed 's/%/%25/g' | awk '{printf "%s%%0A", $0}')
            echo "::error title=Android build log tail::$msg"
          fi
          exit $status

      - uses: actions/upload-artifact@v7
        with:
          name: audemo-android
          path: dist/*.apk
          if-no-files-found: error

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [build, android]
    # A fixed image (ubuntu-latest moves to Ubuntu 26 from 2026-10-19).
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/download-artifact@v8
        with:
          path: artifacts
          merge-multiple: true
      - uses: softprops/action-gh-release@v3
        with:
          files: artifacts/*
          generate_release_notes: true
